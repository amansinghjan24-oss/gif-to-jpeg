
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF to JPEG Converter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f8fa;
    color: #202124;
    min-height: 100vh;
    padding: 50px 20px;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

header p {
    color: #777;
    font-size: 15px;
}

.upload-box {
    background: white;
    border: 2px dashed #c8c8c8;
    border-radius: 16px;
    padding: 55px 20px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.upload-box:hover,
.upload-box.dragover {
    border-color: #222;
    background: #f2f2f2;
}

.upload-icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.upload-box h3 {
    margin-bottom: 10px;
}

.upload-box p {
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
}

button {
    border: none;
    padding: 13px 24px;
    border-radius: 8px;
    background: #202124;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #444;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

input[type="file"] {
    display: none;
}

.file-info {
    margin: 20px 0;
    font-size: 14px;
    color: #777;
    text-align: center;
}

.frames-section {
    margin-top: 35px;
    display: none;
}

.frames-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.frames-heading h2 {
    font-size: 19px;
}

.frames-heading span {
    font-size: 13px;
    color: #888;
}

.frames {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px;
}

.frame {
    background: white;
    padding: 7px;
    border: 2px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
}

.frame:hover {
    border-color: #aaa;
}

.frame.selected {
    border-color: #202124;
}

.frame img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    display: block;
    background: #eee;
    border-radius: 5px;
}

.frame small {
    display: block;
    text-align: center;
    margin-top: 8px;
    color: #777;
}

.download-section {
    text-align: center;
    margin-top: 35px;
    display: none;
}

.download-btn {
    padding: 15px 35px;
    font-size: 15px;
}

.status {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: 20px;
}

@media(max-width: 600px) {
    body {
        padding: 30px 15px;
    }

    header h1 {
        font-size: 29px;
    }

    .upload-box {
        padding: 40px 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>GIF to JPEG</h1>
    <p>Select any frame from your GIF and download it as JPEG.</p>
</header>

<label class="upload-box" id="uploadBox" for="gifInput">
    <div class="upload-icon">📁</div>
    <h3>Upload your GIF</h3>
    <p>Drag and drop your GIF here or browse files</p>
    <button type="button">Choose GIF</button>
</label>

<input type="file" id="gifInput" accept=".gif,image/gif">

<div class="file-info" id="fileInfo"></div>

<div class="frames-section" id="framesSection">

    <div class="frames-heading">
        <h2>Select a frame</h2>
        <span id="frameCount"></span>
    </div>

    <div class="frames" id="frames"></div>

</div>

<div class="download-section" id="downloadSection">
    <button class="download-btn" id="downloadBtn" disabled>
        Download JPEG ↓
    </button>
</div>

<div class="status" id="status"></div>

</div>

<script type="module">
import {
    parseGIF,
    decompressFrames
} from "https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/+esm";

const gifInput = document.getElementById("gifInput");
const uploadBox = document.getElementById("uploadBox");
const framesArea = document.getElementById("frames");
const framesSection = document.getElementById("framesSection");
const downloadSection = document.getElementById("downloadSection");
const downloadBtn = document.getElementById("downloadBtn");
const status = document.getElementById("status");

let selectedCanvas = null;
let currentFile = null;

gifInput.addEventListener("change", () => {
    if (gifInput.files.length) {
        loadGIF(gifInput.files[0]);
    }
});

uploadBox.addEventListener("dragover", (e) => {
    e.preventDefault();
    uploadBox.classList.add("dragover");
});

uploadBox.addEventListener("dragleave", () => {
    uploadBox.classList.remove("dragover");
});

uploadBox.addEventListener("drop", (e) => {
    e.preventDefault();
    uploadBox.classList.remove("dragover");

    const file = e.dataTransfer.files[0];

    if (file && (file.type === "image/gif" ||
        file.name.toLowerCase().endsWith(".gif"))) {
        loadGIF(file);
    } else {
        status.textContent = "Please select a GIF file.";
    }
});

async function loadGIF(file) {

    currentFile = file;
    selectedCanvas = null;

    framesArea.innerHTML = "";
    framesSection.style.display = "none";
    downloadSection.style.display = "none";
    downloadBtn.disabled = true;

    document.getElementById("fileInfo").textContent =
        file.name + " (" + (file.size / 1024).toFixed(1) + " KB)";

    status.textContent = "Processing GIF...";

    try {

        const buffer = await file.arrayBuffer();

        const gif = parseGIF(buffer);
        const decodedFrames = decompressFrames(gif, true);

        const width = gif.lsd.width;
        const height = gif.lsd.height;

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        decodedFrames.forEach((frame, index) => {

            let previousCanvas = null;

            if (frame.disposalType === 3) {
                previousCanvas = document.createElement("canvas");
                previousCanvas.width = width;
                previousCanvas.height = height;
                previousCanvas.getContext("2d").drawImage(canvas, 0, 0);
            }

            const patch = document.createElement("canvas");
            patch.width = frame.dims.width;
            patch.height = frame.dims.height;

            const patchCtx = patch.getContext("2d");

            const imageData = new ImageData(
                new Uint8ClampedArray(frame.patch),
                frame.dims.width,
                frame.dims.height
            );

            patchCtx.putImageData(imageData, 0, 0);

            ctx.drawImage(
                patch,
                frame.dims.left,
                frame.dims.top
            );

            const snapshot = document.createElement("canvas");
            snapshot.width = width;
            snapshot.height = height;

            snapshot.getContext("2d").drawImage(canvas, 0, 0);

            createFrame(snapshot, index);

            if (frame.disposalType === 2) {

                ctx.clearRect(
                    frame.dims.left,
                    frame.dims.top,
                    frame.dims.width,
                    frame.dims.height
                );

            } else if (frame.disposalType === 3 && previousCanvas) {

                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(previousCanvas, 0, 0);

            }

        });

        framesSection.style.display = "block";
        downloadSection.style.display = "block";

        document.getElementById("frameCount").textContent =
            decodedFrames.length + " frames";

        status.textContent = "Select any frame to download as JPEG.";

    } catch (error) {

        console.error(error);
        status.textContent = "Unable to process this GIF. Please try another file.";

    }
}

function createFrame(canvas, index) {

    const card = document.createElement("div");
    card.className = "frame";

    const img = document.createElement("img");
    img.src = canvas.toDataURL("image/png");

    const label = document.createElement("small");
    label.textContent = "Frame " + (index + 1);

    card.appendChild(img);
    card.appendChild(label);

    card.addEventListener("click", () => {

        document.querySelectorAll(".frame").forEach(frame => {
            frame.classList.remove("selected");
        });

        card.classList.add("selected");

        selectedCanvas = canvas;
        downloadBtn.disabled = false;

        status.textContent = "Frame " + (index + 1) + " selected.";

    });

    framesArea.appendChild(card);
}

downloadBtn.addEventListener("click", () => {

    if (!selectedCanvas) return;

    const output = document.createElement("canvas");

    output.width = selectedCanvas.width;
    output.height = selectedCanvas.height;

    const ctx = output.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, output.width, output.height);

    ctx.drawImage(selectedCanvas, 0, 0);

    output.toBlob((blob) => {

        if (!blob) {
            status.textContent = "JPEG conversion failed.";
            return;
        }

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "selected-frame.jpeg";
        link.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        status.textContent = "JPEG downloaded successfully!";

    }, "image/jpeg", 0.95);

});

</script>

</body>
</html>
